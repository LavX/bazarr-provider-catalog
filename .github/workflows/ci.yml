name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: validate + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate catalog and manifests
        run: python3 -B -m sdk validate
      - name: catalog.json is up to date
        run: |
          python3 -B -m sdk build-catalog
          git diff --exit-code -- catalog.json providers
      - name: Run test suite
        run: python3 -B -m unittest discover -s tests

  wheel-coverage:
    name: wheel matrix coverage (no drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compiled dependency wheels cover the worker matrix
        run: |
          python3 scripts/expand_wheel_hashes.py
          git diff --exit-code -- providers
